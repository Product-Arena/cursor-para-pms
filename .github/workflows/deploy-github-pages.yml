# Publishes slides (docs/) and student guide (guia-do-aluno/) to GitHub Pages.
# Sources live in separate folders; this workflow assembles the public site (no git duplicate).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/guia-do-aluno
          rsync -a docs/ _site/ --exclude '.DS_Store'
          rsync -a guia-do-aluno/ _site/guia-do-aluno/ \
            --exclude '.github' \
            --exclude '.replit' \
            --exclude 'REPLIT.md' \
            --exclude '.DS_Store'
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
